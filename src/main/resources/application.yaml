  spring:
    application:
      name: marketplace

    datasource:
      url: jdbc:postgresql://localhost:5432/marketplace
      username: developer
      password: 123456
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
