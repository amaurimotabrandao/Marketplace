  spring:
    application:
      name: marketplace

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
      username: ${DB_USERNAME:developer}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
