services:
  postgres:
    image: postgres:17
    container_name: postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d meu_banco"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
